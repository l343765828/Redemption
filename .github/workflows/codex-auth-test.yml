name: Codex Auth Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-test:
    runs-on:
      - self-hosted
      - windows
      - x64
      - codex-producer

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check environment
        shell: powershell
        run: |
          whoami
          Get-Command codex
          codex --version

      - name: Test Codex account
        shell: powershell
        run: |
          codex exec "只输出 CODEX_OK，不要修改任何文件"
