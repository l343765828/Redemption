# Operator entry point for Loop Engine.
# auto: initialize or recover the current Cycle and continue from durable state.
# next-cycle: MANUAL governance action, allowed only after PAUSED_AWAITING_USER.

name: loop-engine

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: auto = start/recover current Cycle; next-cycle = manually continue after PAUSED_AWAITING_USER
        required: true
        default: auto
        type: choice
        options:
          - auto
          - next-cycle
      uat_write_authorization_confirmed:
        description: One workflow dispatch is the explicit non-interactive preauthorization point for the current Cycle; the durable scope covers later Round/Candidate stages in that Cycle.
        required: true
        default: false
        type: boolean
      uat_authorization_id:
        description: Required when write authorization is confirmed; use a change ticket, approval record, or operator confirmation ID.
        required: false
        default: ""
        type: string
      uat_authorized_actions:
        description: "Comma-separated tokens. This scheduler-Pod UAT uses test-data-write,exec,debug,git-update,restart; deploy/scale/delete are not required. Use none when not authorizing writes."
        required: false
        default: none
        type: string
      uat_target_namespace:
        description: "Exact Kubernetes namespace for this Cycle. The version-controlled R9 runtime target is dask-operator."
        required: false
        default: ""
        type: string
      uat_resource_scope:
        description: "Comma/semicolon-separated kind/name or kind/prefix*. Minimal R9 scope: node/node3,deployment/dask-cluster-scheduler,pod/dask-cluster-scheduler-*"
        required: false
        default: ""
        type: string
      uat_target_branch:
        description: Exact Git branch allowed for git-update operations in this Cycle.
        required: false
        default: codex/pvam-work02-uat-candidate-20260813
        type: string
      uat_impact_scope:
        description: Impact boundary for the Cycle authorization. v13 accepts isolated-uat-only.
        required: false
        default: isolated-uat-only
        type: string

concurrency:
  group: loop-engine
  cancel-in-progress: false

env:
  WORKTREE: D:\Redemption\Worktrees\pvam-work02-m2-float64-test
  MAINREPO: D:\Redemption\Redemption
  OUTDIR: D:\Redemption\Redemption\.loop-output
  BRANCH: codex/pvam-work02-uat-candidate-20260813
  SSH_URL: git@github.com:l343765828/Redemption.git
  LOOP_STATE_SCRIPT: D:\Redemption\Redemption\.loop-engine\loop-state.ps1
  LOOP_STATE_FILE: D:\Redemption\Redemption\.loop-output\loop-state.json
  LOOP_CYCLES_DIR: D:\Redemption\Redemption\.loop-output\cycles
  UAT_PERIOD_POOL_FILE: D:\Redemption\Redemption\.loop-engine\uat-period-pool.json

jobs:
  prepare:
    runs-on: self-hosted
    outputs:
      cycle: ${{ steps.state.outputs.cycle }}
      start_round: ${{ steps.state.outputs.start_round }}
      start_action: ${{ steps.state.outputs.start_action }}
      previous_report: ${{ steps.state.outputs.previous_report }}
      state_status: ${{ steps.state.outputs.state_status }}
      findings_source: ${{ steps.state.outputs.findings_source }}
      findings_ref: ${{ steps.state.outputs.findings_ref }}
      candidate_branch: ${{ steps.state.outputs.candidate_branch }}
      cycle_start_sha: ${{ steps.state.outputs.cycle_start_sha }}
      current_candidate_sha: ${{ steps.state.outputs.current_candidate_sha }}
    steps:
      - name: Reconcile durable loop state
        id: state
        shell: powershell
        env:
          INPUT_RUN_MODE: ${{ inputs.run_mode }}
        run: |
          if (-not (Test-Path $env:LOOP_STATE_SCRIPT)) { Write-Error "loop state script missing: $env:LOOP_STATE_SCRIPT"; exit 1 }
          & $env:LOOP_STATE_SCRIPT -Operation Prepare -RunMode $env:INPUT_RUN_MODE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bind or reuse non-interactive Cycle UAT authorization
        if: ${{ steps.state.outputs.start_action != 'none' }}
        shell: powershell
        env:
          PREPARED_CYCLE: ${{ steps.state.outputs.cycle }}
          INPUT_AUTH_CONFIRMED: ${{ inputs.uat_write_authorization_confirmed }}
          INPUT_AUTH_ID: ${{ inputs.uat_authorization_id }}
          INPUT_AUTH_ACTIONS: ${{ inputs.uat_authorized_actions }}
          INPUT_AUTH_NAMESPACE: ${{ inputs.uat_target_namespace }}
          INPUT_AUTH_RESOURCE_SCOPE: ${{ inputs.uat_resource_scope }}
          INPUT_AUTH_TARGET_BRANCH: ${{ inputs.uat_target_branch }}
          INPUT_AUTH_IMPACT_SCOPE: ${{ inputs.uat_impact_scope }}
          AUTH_ACTOR: ${{ github.actor }}
          AUTH_RUN_ID: ${{ github.run_id }}
          AUTH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          & $env:LOOP_STATE_SCRIPT -Operation BindCycleUatAuthorization `
            -Cycle ([int]$env:PREPARED_CYCLE) `
            -AuthorizationConfirmed $env:INPUT_AUTH_CONFIRMED `
            -AuthorizationId $env:INPUT_AUTH_ID `
            -AuthorizedActions $env:INPUT_AUTH_ACTIONS `
            -AuthorizationActor $env:AUTH_ACTOR `
            -AuthorizationRunId $env:AUTH_RUN_ID `
            -AuthorizationRunAttempt $env:AUTH_RUN_ATTEMPT `
            -TargetNamespace $env:INPUT_AUTH_NAMESPACE `
            -ResourceScope $env:INPUT_AUTH_RESOURCE_SCOPE `
            -TargetBranch $env:INPUT_AUTH_TARGET_BRANCH `
            -ImpactScope $env:INPUT_AUTH_IMPACT_SCOPE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload reconciled cycle evidence
        if: ${{ !cancelled() && steps.state.outputs.cycle != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: loop-reconcile-cycle-${{ steps.state.outputs.cycle }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            D:\Redemption\Redemption\.loop-output\loop-state.json
            D:\Redemption\Redemption\.loop-output\cycles\cycle-${{ steps.state.outputs.cycle }}\
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  round1:
    name: round-1
    needs: prepare
    if: ${{ needs.prepare.outputs.start_round == '1' && needs.prepare.outputs.start_action != 'none' }}
    uses: ./.github/workflows/loop-round.yml
    with:
      cycle: ${{ needs.prepare.outputs.cycle }}
      round: "1"
      action: ${{ needs.prepare.outputs.start_action }}
      previous_report: ${{ needs.prepare.outputs.previous_report }}
      findings_source: ${{ needs.prepare.outputs.findings_source }}
      findings_ref: ${{ needs.prepare.outputs.findings_ref }}

  round2:
    name: round-2
    needs: [prepare, round1]
    if: >-
      ${{
        !cancelled() &&
        needs.prepare.result == 'success' &&
        (
          (needs.prepare.outputs.start_round == '2' && needs.prepare.outputs.start_action != 'none') ||
          (needs.prepare.outputs.start_round == '1' && needs.round1.result == 'success' && needs.round1.outputs.opus_result == 'BUG_FOUND')
        )
      }}
    uses: ./.github/workflows/loop-round.yml
    with:
      cycle: ${{ needs.prepare.outputs.cycle }}
      round: "2"
      action: ${{ needs.prepare.outputs.start_round == '2' && needs.prepare.outputs.start_action || 'rework' }}
      previous_report: ${{ needs.prepare.outputs.start_round == '2' && needs.prepare.outputs.previous_report || needs.round1.outputs.report_path }}
      findings_source: ${{ needs.prepare.outputs.start_round == '2' && needs.prepare.outputs.findings_source || 'OPUS' }}
      findings_ref: ${{ needs.prepare.outputs.start_round == '2' && needs.prepare.outputs.findings_ref || needs.round1.outputs.report_path }}

  round3:
    name: round-3
    needs: [prepare, round1, round2]
    if: >-
      ${{
        !cancelled() &&
        needs.prepare.result == 'success' &&
        (
          (needs.prepare.outputs.start_round == '3' && needs.prepare.outputs.start_action != 'none') ||
          (needs.round2.result == 'success' && needs.round2.outputs.opus_result == 'BUG_FOUND')
        )
      }}
    uses: ./.github/workflows/loop-round.yml
    with:
      cycle: ${{ needs.prepare.outputs.cycle }}
      round: "3"
      action: ${{ needs.prepare.outputs.start_round == '3' && needs.prepare.outputs.start_action || 'rework' }}
      previous_report: ${{ needs.prepare.outputs.start_round == '3' && needs.prepare.outputs.previous_report || needs.round2.outputs.report_path }}
      findings_source: ${{ needs.prepare.outputs.start_round == '3' && needs.prepare.outputs.findings_source || 'OPUS' }}
      findings_ref: ${{ needs.prepare.outputs.start_round == '3' && needs.prepare.outputs.findings_ref || needs.round2.outputs.report_path }}

  finalize:
    needs: [prepare, round1, round2, round3]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: self-hosted
    steps:
      - name: Final loop status
        shell: powershell
        run: |
          & $env:LOOP_STATE_SCRIPT -Operation Summarize
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload loop state
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: loop-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            D:\Redemption\Redemption\.loop-output\loop-state.json
            D:\Redemption\Redemption\.loop-output\cycles\cycle-${{ needs.prepare.outputs.cycle }}\cycle-summary.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
