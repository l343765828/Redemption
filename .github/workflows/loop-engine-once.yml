# Loop Engine 单轮闭环：Codex 施工 → Claude 复核+UAT
# 触发：手动（GitHub → Actions → Run workflow）。不用 push 触发——Job 1 里 Codex 自己会 push，
# 若按 push 触发会自我循环。
# 运行环境：self-hosted runner（redemption-codex-01，本机）。两个 Job 同机，
# 直接操作 D:\ 绝对路径，不需要 checkout / artifact 传递 patch。
# 前提：runner 以 Administrator 账户启动（run.cmd），codex/claude CLI 的登录态才可见。
#
# 编码纪律：run 脚本体一律 ASCII——GitHub runner 写给 PowerShell 5.1 的 .ps1 若含中文，
# 存在按 ANSI 误读致 mojibake/解析劫难的风险。中文只允许出现在：yaml 注释（不进脚本）、
# yaml env 值（经进程环境传递，不经脚本解析）、外部 UTF-8 文件（显式编码读取）。

name: loop-engine-once

on:
  workflow_dispatch:

concurrency:
  group: loop-engine
  cancel-in-progress: false

env:
  WORKTREE: D:\Redemption\Worktrees\pvam-work02-m2-float64-test
  MAINREPO: D:\Redemption\Redemption
  OUTDIR: D:\Redemption\Redemption\.loop-output
  BRANCH: codex/pvam-work02-uat-candidate-20260813
  BASELINE: 6281356d77306016cfb96567e84c14a66eefdbbb
  SSH_URL: git@github.com:l343765828/Redemption.git

  # 含中文的路径全部走 env（进程环境传递不受脚本编码影响），脚本体内不写中文字面量
  PRODUCER_PROMPT: D:\Redemption\Redemption\WORK-PVAM-02_施工会话_启动提示词.md
  VERIFIER_PROMPT: D:\Redemption\Redemption\WORK-PVAM-02_复核与UAT会话_启动提示词.md
  OVERRIDE_FILE: D:\Redemption\Redemption\.loop-engine\automated-override.md

  # 模型与推理强度：显式传入，不依赖用户级 config.toml（避免它变动导致本 workflow 行为静默改变）
  CODEX_MODEL: gpt-5.6-sol
  CODEX_REASONING_EFFORT: xhigh          # codex 配置键：model_reasoning_effort
  CLAUDE_MODEL: fable                    # 别名，等价 claude-fable-5
  CLAUDE_EFFORT: ultracode               # 官方文档确认的特例值（v2.1.203+，本机 2.1.233 实测接受）：
                                         # = xhigh 推理 + 自动多 agent 编排。-p 模式下提示词里的
                                         # ultracode 关键词不触发编排（v2.1.210 起仅人工输入触发），
                                         # headless 唯一入口就是本 flag。

jobs:
  codex-producer:
    runs-on: self-hosted
    timeout-minutes: 720
    steps:
      - name: Preflight worktree
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force $env:OUTDIR | Out-Null
          # Clean stale verdict files: otherwise a crashed round could be judged by last round's outputs
          Remove-Item -Force -ErrorAction SilentlyContinue `
            "$env:OUTDIR\codex-final.txt", "$env:OUTDIR\IMPLEMENTATION_HANDOFF.md", `
            "$env:OUTDIR\uat-result.txt", "$env:OUTDIR\UAT_REPORT.md"
          $head = (git -C $env:WORKTREE rev-parse HEAD).Trim()
          Write-Output "worktree HEAD = $head"
          $status = git -C $env:WORKTREE status --porcelain
          if ($status) { Write-Error "worktree not clean:`n$status"; exit 1 }
          # HEAD must be baseline or its descendant (allows resuming from a previous committed round)
          $mb = (git -C $env:WORKTREE merge-base $head $env:BASELINE).Trim()
          if ($mb -ne $env:BASELINE) { Write-Error "HEAD is not a descendant of baseline $env:BASELINE"; exit 1 }

      - name: Codex construct
        shell: powershell
        run: |
          # PS5.1 pipes to native stdin using ANSI by default; force UTF-8 (known pitfall in this repo)
          $OutputEncoding = New-Object System.Text.UTF8Encoding($false)
          $prompt = [IO.File]::ReadAllText($env:PRODUCER_PROMPT, [System.Text.Encoding]::UTF8)
          # --add-dir OUTDIR: workspace-write sandbox roots at WORKTREE; the handoff file must land
          # in OUTDIR (outside the workspace), and writing it into the worktree would dirty git status
          $prompt | & codex exec `
            --model $env:CODEX_MODEL `
            -c "model_reasoning_effort=`"$env:CODEX_REASONING_EFFORT`"" `
            --sandbox workspace-write `
            -C $env:WORKTREE `
            --add-dir $env:OUTDIR `
            --output-last-message "$env:OUTDIR\codex-final.txt" `
            -
          if ($LASTEXITCODE -ne 0) { Write-Error "codex exec exited $LASTEXITCODE"; exit 1 }

      - name: Gate READY_FOR_UAT + push consistency
        shell: powershell
        run: |
          $final = [IO.File]::ReadAllText("$env:OUTDIR\codex-final.txt", [System.Text.Encoding]::UTF8)
          if ($final -match "PRODUCER_BLOCKED") { Write-Error "Producer blocked. See codex-final.txt"; exit 1 }
          if ($final -notmatch "READY_FOR_UAT")  { Write-Error "Producer did not declare READY_FOR_UAT"; exit 1 }
          $local  = (git -C $env:WORKTREE rev-parse HEAD).Trim()
          $remote = (git -C $env:WORKTREE ls-remote $env:SSH_URL "refs/heads/$env:BRANCH") -split "\s" | Select-Object -First 1
          Write-Output "local=$local  remote=$remote"
          if ($remote -ne $local) { Write-Error "push mismatch: remote branch != local HEAD"; exit 1 }
          git -C $env:WORKTREE log --oneline "$($env:BASELINE.Substring(0,8))..HEAD"
          if (-not (Test-Path "$env:OUTDIR\IMPLEMENTATION_HANDOFF.md")) { Write-Error "IMPLEMENTATION_HANDOFF.md missing in OUTDIR"; exit 1 }
          # Construction must not leave the worktree dirty (everything belongs in commits)
          $status = git -C $env:WORKTREE status --porcelain
          if ($status) { Write-Error "worktree dirty after construction:`n$status"; exit 1 }

      - name: Upload producer output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: producer-output
          path: D:\Redemption\Redemption\.loop-output\
          if-no-files-found: warn

  claude-verifier:
    needs: codex-producer
    runs-on: self-hosted
    timeout-minutes: 720
    steps:
      - name: Env preflight
        shell: powershell
        run: |
          $kc = "C:\Users\Administrator\AppData\Local\Temp\codex-pvam-kubectl\kubectl.exe"
          if (-not (Test-Path $kc)) { Write-Error "kubectl missing at $kc (Temp may have been purged; move it to a stable path and update this workflow)"; exit 1 }
          if (-not (Test-Path $env:OVERRIDE_FILE)) { Write-Error "override file missing: $env:OVERRIDE_FILE"; exit 1 }
          # Job 2 can be re-run standalone; clean verdict files again (cannot rely on Job 1's cleanup)
          Remove-Item -Force -ErrorAction SilentlyContinue "$env:OUTDIR\uat-result.txt", "$env:OUTDIR\UAT_REPORT.md"
          # Deployment model (user decision 2026-08-15): enter node3 HOST via kubectl debug
          # (GitHub SSH keys live on node3, not in pods); git runs ON node3. See Verifier prompt D-1.
          foreach ($p in 8443, 36378) {
            $ok = Test-NetConnection -ComputerName 192.168.18.149 -Port $p -WarningAction SilentlyContinue -InformationLevel Quiet
            Write-Output "192.168.18.149:$p => $ok"
            if (-not $ok) { Write-Error "UAT_ENV_BLOCKED: cluster port $p unreachable"; exit 1 }
          }

      - name: Claude review + UAT
        shell: powershell
        run: |
          $OutputEncoding = New-Object System.Text.UTF8Encoding($false)
          Set-Location $env:MAINREPO
          # Override text lives in an external UTF-8 file, NOT a here-string in this script:
          # (1) Chinese in the .ps1 body risks mojibake under PS5.1; (2) claude CLI silently
          # ignores unknown flags (verified), so stdin-prepending beats --append-system-prompt.
          $override = [IO.File]::ReadAllText($env:OVERRIDE_FILE, [System.Text.Encoding]::UTF8)
          $prompt   = [IO.File]::ReadAllText($env:VERIFIER_PROMPT, [System.Text.Encoding]::UTF8)
          # --effort ultracode enables multi-agent adversarial review (caught 2 BLOCKING findings
          # in supervised sessions). verifier-settings.json allows Workflow/Agent; subagents run
          # acceptEdits but inherit the same allowlist (deny still applies). In -p mode the
          # workflow launch needs no approval. Cost: significantly more time and tokens per round.
          ($override + "`n" + $prompt) | & claude -p --permission-mode dontAsk `
            --model $env:CLAUDE_MODEL `
            --effort $env:CLAUDE_EFFORT `
            --settings "$env:MAINREPO\.loop-engine\verifier-settings.json" `
            --add-dir "D:\Redemption\Worktrees\pvam-work02-m2-float64-test" `
            --add-dir "D:\Redemption\Worktrees\pvam-governance"
          Write-Output "claude exited: $LASTEXITCODE"

      - name: Read result
        shell: powershell
        run: |
          $f = "$env:OUTDIR\uat-result.txt"
          if (-not (Test-Path $f)) { Write-Error "uat-result.txt missing - verifier did not complete its contract"; exit 1 }
          $r = ([IO.File]::ReadAllText($f, [System.Text.Encoding]::UTF8)).Trim()
          Write-Output "=== FINAL RESULT: $r ==="
          switch ($r) {
            "PASS"     { exit 0 }
            "REJECTED" { Write-Error "REJECTED - see UAT_REPORT.md; hand the report back to Codex for rework"; exit 1 }
            "BLOCKED"  { Write-Error "BLOCKED - fix environment or make the pending human decision; do NOT change code"; exit 1 }
            default    { Write-Error "invalid result: $r"; exit 1 }
          }

      - name: Upload verifier output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-output
          path: D:\Redemption\Redemption\.loop-output\
          if-no-files-found: warn
