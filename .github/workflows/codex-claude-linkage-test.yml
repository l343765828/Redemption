name: Codex Claude Linkage Test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CODEX_MODEL: gpt-5.6-sol
  CODEX_REASONING_EFFORT: high

  CLAUDE_MODEL: opus
  CLAUDE_EFFORT: xhigh

jobs:

  # ============================================================
  # Job 1
  # Codex acts as the Producer.
  #
  # It does NOT modify repository files.
  # It only produces a dynamic handoff message.
  # ============================================================
  codex-producer:

    runs-on:
      - self-hosted
      - windows
      - x64
      - codex-producer

    timeout-minutes: 10

    outputs:
      handoff: ${{ steps.produce-handoff.outputs.handoff }}
      link_id: ${{ steps.produce-handoff.outputs.link_id }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Codex environment
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Codex Producer Environment"
          Write-Host "========================================"

          whoami
          $PSVersionTable.PSVersion

          Get-Command codex
          codex --version

          Write-Host ""
          Write-Host "Requested Codex model:"
          Write-Host $env:CODEX_MODEL

          Write-Host ""
          Write-Host "Requested reasoning effort:"
          Write-Host $env:CODEX_REASONING_EFFORT

      - name: Produce Codex handoff
        id: produce-handoff
        shell: powershell
        env:
          LINK_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          Write-Host "========================================"
          Write-Host "Codex Producer"
          Write-Host "========================================"

          $expected = "CODEX_HANDOFF_OK::$env:LINK_ID"

          Write-Host "Link ID:"
          Write-Host $env:LINK_ID

          Write-Host ""
          Write-Host "Expected Codex handoff:"
          Write-Host $expected

          $reasoningConfig = 'model_reasoning_effort="' + $env:CODEX_REASONING_EFFORT + '"'

          $outputFile = Join-Path `
            $env:RUNNER_TEMP `
            "codex-linkage-output.txt"

          if (Test-Path $outputFile) {
            Remove-Item $outputFile -Force
          }

          $prompt = @"
          This is a GitHub Actions linkage smoke test.

          Output exactly the following single line:

          $expected

          Requirements:
          - Do not add explanation.
          - Do not add Markdown.
          - Do not add quotes.
          - Do not modify any files.
          "@

          codex exec `
            --model $env:CODEX_MODEL `
            --config $reasoningConfig `
            --sandbox read-only `
            --output-last-message $outputFile `
            "$prompt"

          if ($LASTEXITCODE -ne 0) {
            throw "Codex process failed with exit code $LASTEXITCODE."
          }

          if (-not (Test-Path $outputFile)) {
            throw "Codex did not create the expected output file."
          }

          $result = (Get-Content $outputFile -Raw).Trim()

          Write-Host ""
          Write-Host "Actual Codex handoff:"
          Write-Host "[$result]"

          if ($result -ne $expected) {
            throw "Codex handoff mismatch. Expected [$expected], actual [$result]."
          }

          Write-Host ""
          Write-Host "Codex handoff generation: PASS"

          # PowerShell 5.1-safe UTF-8 output for GitHub Actions
          "handoff=$result" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "link_id=$env:LINK_ID" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

      - name: Verify Codex did not modify repository
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Repository Integrity Check"
          Write-Host "========================================"

          $changes = git status --porcelain

          if ($changes) {
            Write-Host "Unexpected repository changes:"
            Write-Host $changes

            throw "Codex modified repository files during linkage smoke test."
          }

          Write-Host "Repository unchanged."
          Write-Host "CODEX_PRODUCER_TEST=PASS"


  # ============================================================
  # Job 2
  # Claude acts as the Verifier.
  #
  # It receives the real output generated by Codex Job 1.
  # It must validate the dynamic LINK_ID.
  # ============================================================
  claude-verifier:

    needs:
      - codex-producer

    runs-on:
      - self-hosted
      - windows
      - x64
      - claude-verifier

    timeout-minutes: 10

    env:
      CODEX_HANDOFF: ${{ needs.codex-producer.outputs.handoff }}
      LINK_ID: ${{ needs.codex-producer.outputs.link_id }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Claude environment
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Claude Verifier Environment"
          Write-Host "========================================"

          whoami
          $PSVersionTable.PSVersion

          Get-Command claude
          claude --version

          Write-Host ""
          Write-Host "Requested Claude model:"
          Write-Host $env:CLAUDE_MODEL

          Write-Host ""
          Write-Host "Requested Claude effort:"
          Write-Host $env:CLAUDE_EFFORT

      - name: Verify GitHub job handoff
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "GitHub Job Output Verification"
          Write-Host "========================================"

          if ([string]::IsNullOrWhiteSpace($env:CODEX_HANDOFF)) {
            throw "CODEX_HANDOFF is empty."
          }

          if ([string]::IsNullOrWhiteSpace($env:LINK_ID)) {
            throw "LINK_ID is empty."
          }

          $expectedHandoff = "CODEX_HANDOFF_OK::$env:LINK_ID"

          Write-Host "Received LINK_ID:"
          Write-Host $env:LINK_ID

          Write-Host ""
          Write-Host "Received Codex handoff:"
          Write-Host "[$env:CODEX_HANDOFF]"

          Write-Host ""
          Write-Host "Expected Codex handoff:"
          Write-Host "[$expectedHandoff]"

          if ($env:CODEX_HANDOFF -ne $expectedHandoff) {
            throw "GitHub Job Output handoff mismatch."
          }

          Write-Host ""
          Write-Host "GitHub cross-job handoff: PASS"

      - name: Claude verifies Codex handoff
        shell: powershell
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          Write-Host "========================================"
          Write-Host "Claude Verifier"
          Write-Host "========================================"

          $expectedHandoff = "CODEX_HANDOFF_OK::$env:LINK_ID"
          $expectedClaude = "CLAUDE_LINK_OK::$env:LINK_ID"

          $prompt = @"
          You are the verifier in a GitHub Actions linkage smoke test.

          A previous Codex Producer job generated this handoff:

          $env:CODEX_HANDOFF

          The expected handoff is:

          $expectedHandoff

          Verify the two strings.

          If and only if they are exactly identical, output exactly:

          $expectedClaude

          Otherwise output exactly:

          CLAUDE_LINK_REJECTED

          Requirements:
          - Output one line only.
          - Do not add explanation.
          - Do not add Markdown.
          - Do not add quotes.
          - Do not modify any files.
          "@

          $result = claude -p `
            --model $env:CLAUDE_MODEL `
            --effort $env:CLAUDE_EFFORT `
            --permission-mode plan `
            "$prompt"

          if ($LASTEXITCODE -ne 0) {
            throw "Claude process failed with exit code $LASTEXITCODE."
          }

          $resultText = ($result | Out-String).Trim()

          Write-Host ""
          Write-Host "Claude output:"
          Write-Host "[$resultText]"

          Write-Host ""
          Write-Host "Expected Claude output:"
          Write-Host "[$expectedClaude]"

          if ($resultText -ne $expectedClaude) {
            throw "Claude linkage verification failed."
          }

          Write-Host ""
          Write-Host "CLAUDE_VERIFIER_TEST=PASS"

      - name: Verify Claude did not modify repository
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Repository Integrity Check"
          Write-Host "========================================"

          $changes = git status --porcelain

          if ($changes) {
            Write-Host "Unexpected repository changes:"
            Write-Host $changes

            throw "Claude modified repository files during linkage smoke test."
          }

          Write-Host "Repository unchanged."

          Write-Host ""
          Write-Host "========================================"
          Write-Host "CODEX_CLAUDE_LINKAGE_TEST=PASS"
          Write-Host "========================================"
