name: Claude Auth Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claude-test:
    runs-on:
      - self-hosted
      - windows
      - x64
      - claude-verifier

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check environment
        shell: powershell
        run: |
          whoami
          $PSVersionTable.PSVersion
          Get-Command claude
          claude --version

      - name: Test Claude account
        shell: powershell
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          $result = claude -p "Output exactly CLAUDE_OK. Do not modify any files." --permission-mode plan

          Write-Host "Claude output:"
          Write-Host $result

          if ($result.Trim() -ne "CLAUDE_OK") {
              throw "Claude smoke test failed. Expected CLAUDE_OK."
          }
